      <stop offset="0%" stop-color="#EFE4DC"/>
      <stop offset="100%" stop-color="#D8BFB4"/>
    </linearGradient>
    <radialGradient id="blob-g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A9646F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A9646F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-g1" x="-30%" y="-30%" width="160%" height="160%">
